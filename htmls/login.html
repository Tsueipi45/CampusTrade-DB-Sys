<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>校园二手交易平台数据库系统</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#dce9ff",
                    "on-tertiary-container": "#ffd2be",
                    "surface-container-low": "#eff4ff",
                    "primary-fixed-dim": "#c3c0ff",
                    "on-error": "#ffffff",
                    "error-container": "#ffdad6",
                    "outline-variant": "#c7c4d8",
                    "secondary-container": "#b6b4ff",
                    "secondary": "#58579b",
                    "secondary-fixed-dim": "#c3c0ff",
                    "inverse-on-surface": "#eaf1ff",
                    "surface-container": "#e5eeff",
                    "surface-container-lowest": "#ffffff",
                    "surface-tint": "#4d44e3",
                    "inverse-primary": "#c3c0ff",
                    "on-tertiary-fixed-variant": "#7b2f00",
                    "on-primary-fixed-variant": "#3323cc",
                    "surface-container-highest": "#d3e4fe",
                    "on-primary-container": "#dad7ff",
                    "primary-container": "#4f46e5",
                    "error": "#ba1a1a",
                    "on-secondary-container": "#454386",
                    "surface-dim": "#cbdbf5",
                    "secondary-fixed": "#e2dfff",
                    "on-surface-variant": "#464555",
                    "surface-variant": "#d3e4fe",
                    "on-tertiary-fixed": "#351000",
                    "on-secondary": "#ffffff",
                    "on-primary": "#ffffff",
                    "on-secondary-fixed-variant": "#413f82",
                    "tertiary-fixed": "#ffdbcc",
                    "primary-fixed": "#e2dfff",
                    "outline": "#777587",
                    "on-surface": "#0b1c30",
                    "on-error-container": "#93000a",
                    "tertiary-fixed-dim": "#ffb695",
                    "surface-bright": "#f8f9ff",
                    "inverse-surface": "#213145",
                    "on-secondary-fixed": "#140f54",
                    "on-primary-fixed": "#0f0069",
                    "background": "#f8f9ff",
                    "on-background": "#0b1c30",
                    "on-tertiary": "#ffffff",
                    "primary": "#3525cd",
                    "surface": "#f8f9ff",
                    "tertiary": "#7e3000",
                    "tertiary-container": "#a44100"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .headline { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-surface text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<nav class="fixed top-0 left-0 w-full z-50 bg-slate-50/80 dark:bg-slate-950/80 backdrop-blur-xl shadow-[0px_20px_40px_rgba(15,0,105,0.06)]">
<div class="flex items-center justify-between px-8 h-20 w-full max-w-screen-2xl mx-auto">
<!-- Brand -->
<div class="text-xl font-black tracking-tighter text-indigo-700 dark:text-indigo-300">
            二手交易平台管理系统
        </div>
<!-- Actions -->
<div class="flex items-center space-x-4">
<a href="/login" class="text-indigo-700 dark:text-indigo-300 font-bold border-b-2 border-indigo-600 pb-1 text-sm">登录</a>
<a href="/register" class="text-slate-500 dark:text-slate-400 hover:text-indigo-600 transition-colors text-sm">注册</a>
</div>
</div>
</nav>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center pt-20 px-6 relative overflow-hidden bg-gradient-to-br from-surface via-surface-container-low to-surface-container-high">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="absolute top-24 z-50 w-full max-w-md mx-auto">
            {% for message in messages %}
            <div class="flash-message bg-error-container text-on-error-container px-4 py-3 rounded-lg shadow-lg mb-2 text-sm font-medium border border-error/10">
                {{ message }}
            </div>
            {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
<!-- Background Decorative Elements -->
<div class="absolute top-[-10%] right-[-5%] w-[40rem] h-[40rem] bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[30rem] h-[30rem] bg-secondary/5 rounded-full blur-3xl"></div>
<!-- Login Card -->
<div class="relative z-10 w-full max-w-[480px]">
<div class="bg-surface-container-lowest p-10 md:p-14 rounded-lg shadow-[0px_20px_40px_rgba(15,0,105,0.06)] border border-outline-variant/10">
<!-- Header -->
<div class="mb-10 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary-container rounded-full mb-6">
<span class="material-symbols-outlined text-on-primary text-3xl" data-icon="lock_open">lock_open</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tight text-on-surface mb-2 font-headline">欢迎回来</h1>
<p class="text-slate-500 text-sm font-body">请登录以管理您的校园资源</p>
</div>
<!-- Form -->
<form class="space-y-6" action="/login" method="POST">
<!-- User ID Field -->
<div class="space-y-2">
<label class="block text-xs font-bold tracking-widest text-on-surface-variant uppercase ml-1" for="user-id">用户 ID</label>
<div class="relative group">
<input class="w-full pl-6 pr-4 py-4 bg-surface-container-highest rounded-full border-none ring-1 ring-transparent focus:ring-2 focus:ring-primary/30 outline-none transition-all placeholder:text-slate-400 text-on-surface" id="user-id" name="user_id" placeholder="请输入您的用户 ID" type="text" required/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-xs font-bold tracking-widest text-on-surface-variant uppercase" for="password">密码</label>
</div>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors" data-icon="key">key</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-highest rounded-full border-none ring-1 ring-transparent focus:ring-2 focus:ring-primary/30 outline-none transition-all placeholder:text-slate-400 text-on-surface" id="password" name="password" placeholder="••••••••" type="password" required/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full py-4 px-6 bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold rounded-full shadow-lg shadow-indigo-100 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center space-x-2" type="submit">
<span>登录账号</span>
<span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Help / Default Credentials -->
<div class="mt-10 p-4 bg-surface-container-low rounded-lg border border-indigo-50">
<div class="flex items-start space-x-3">
<span class="material-symbols-outlined text-primary text-xl mt-0.5" data-icon="info">info</span>
<div>
<p class="text-xs font-bold text-primary tracking-wide mb-1 uppercase">测试账号</p>
<p class="text-[11px] leading-relaxed text-slate-500 font-medium">
                            默认管理员：<span class="text-on-surface font-bold">admin001/admin123</span><br/>
                            默认用户：<span class="text-on-surface font-bold">u001/user123</span>
</p>
</div>
</div>
</div>
<!-- Footer Links -->
<div class="mt-8 text-center text-sm font-medium">
<span class="text-slate-500">还没有账号？</span>
<a class="text-indigo-600 ml-1 hover:underline" href="/register">立即注册</a>
</div>
</div>
</div>
</main>
<!-- Suppressing BottomNavBar on Login Screen per "Relevance Check" and "The Destination Rule" -->
    <script>
        // Flash messages auto-hide
        setTimeout(() => {
            const alerts = document.querySelectorAll('.flash-message');
            alerts.forEach(alert => {
                alert.style.transition = 'opacity 1s ease-out';
                alert.style.opacity = '0';
                setTimeout(() => alert.remove(), 1000);
            });
        }, 5000);
    </script>
</body></html>
